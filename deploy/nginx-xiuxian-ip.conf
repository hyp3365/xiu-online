# Direct-IP test entry over HTTP. Use disposable test credentials only.
# Cloudflare Tunnel connects to the second server block on loopback:18302 (HTTP origin; no Nginx certificate).
# The Node API remains private on 127.0.0.1:18301.
server {
    listen 80;
    server_name __XIU_PUBLIC_IP__;

    location = / {
        return 302 /xiuxian-test/;
    }
    location = /xiuxian-test {
        return 301 /xiuxian-test/;
    }
    location /xiuxian-test/img/ {
        access_log off;
        alias /opt/xiu-online/web/img/;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location /xiuxian-test/js/ {
        access_log off;
        alias /opt/xiu-online/web/js/;
        add_header Cache-Control "public, max-age=604800";
        gzip on;
        gzip_types application/javascript text/javascript;
        gzip_min_length 1024;
    }
    location /xiuxian-test/css/ {
        access_log off;
        alias /opt/xiu-online/web/css/;
        add_header Cache-Control "public, max-age=604800";
        gzip on;
        gzip_types text/css;
        gzip_min_length 1024;
    }
    location /xiuxian-test/api/ {
        proxy_pass http://127.0.0.1:18301/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 2m;
        gzip on; gzip_types application/javascript application/json; gzip_min_length 1024;
        proxy_buffering off;
    }
    location /xiuxian-test/ {
        access_log off;
        alias /opt/xiu-online/web/;
        index index.html;
        add_header Cache-Control "no-cache";
    }
}

# Cloudflare Tunnel origin: set the Tunnel service to http://127.0.0.1:18302.
# Cloudflare terminates public HTTPS; the origin connection to this Nginx listener is plain HTTP.
# This dedicated loopback listener accepts the Tunnel's domain Host header without a per-domain Nginx certificate.
server {
    listen 127.0.0.1:18302;
    server_name _;

    location = / {
        return 302 /xiuxian-test/;
    }
    location = /xiuxian-test {
        return 301 /xiuxian-test/;
