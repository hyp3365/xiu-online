# Direct-IP test entry. HTTP only: use a disposable test account/password.
# The Node API itself remains bound to 127.0.0.1:18301.
server {
    listen 80;
    server_name __XIU_PUBLIC_IP__;

    location = / {
        return 302 /xiuxian-test/;
    }
    location = /xiuxian-test {
        return 301 /xiuxian-test/;
    }
    location /xiuxian-test/img/ {
        access_log off;
        alias /opt/xiu-online/web/img/;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location /xiuxian-test/js/ {
        access_log off;
        alias /opt/xiu-online/web/js/;
        add_header Cache-Control "public, max-age=604800";
        gzip on;
        gzip_types application/javascript text/javascript;
        gzip_min_length 1024;
    }
    location /xiuxian-test/css/ {
        access_log off;
        alias /opt/xiu-online/web/css/;
        add_header Cache-Control "public, max-age=604800";
        gzip on;
        gzip_types text/css;
        gzip_min_length 1024;
    }
    location /xiuxian-test/api/ {
        proxy_pass http://127.0.0.1:18301/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 128k;
        proxy_buffering off;
    }
    location /xiuxian-test/ {
        access_log off;
        alias /opt/xiu-online/web/;
        index index.html;
        add_header Cache-Control "no-cache";
    }
}
