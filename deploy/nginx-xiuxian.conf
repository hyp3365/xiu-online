# xiu-online 测试服专用路径；与旧版 /xiuxian/ 完全分开。
location = /xiuxian-test { return 301 /xiuxian-test/; }

location /xiuxian-test/img/ {
    access_log off;
    alias /opt/xiu-online/web/img/;
    add_header Cache-Control "public, max-age=2592000, immutable";
}
location /xiuxian-test/js/ {
    access_log off;
    alias /opt/xiu-online/web/js/;
    add_header Cache-Control "public, max-age=604800";
    gzip on; gzip_types application/javascript text/javascript; gzip_min_length 1024;
}
location /xiuxian-test/css/ {
    access_log off;
    alias /opt/xiu-online/web/css/;
    add_header Cache-Control "public, max-age=604800";
    gzip on; gzip_types text/css; gzip_min_length 1024;
}
location /xiuxian-test/api/ {
    proxy_pass http://127.0.0.1:18301/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 2m;
        gzip on; gzip_types application/javascript application/json; gzip_min_length 1024;
    proxy_buffering off;
}
location /xiuxian-test/ {
    access_log off;
    alias /opt/xiu-online/web/;
    index index.html;
    add_header Cache-Control "no-cache";
}
