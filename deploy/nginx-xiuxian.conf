# 问道长生：放进 nginx 的 server{} 中（install.sh 会自动处理）
location = /xiuxian { return 301 /xiuxian/; }

# 图片：浏览器缓存 30 天（换图片时代码里的 ?v= 会变，所以不怕旧图）
location /xiuxian/img/ {
    access_log off;   # 不记访问日志，省磁盘
    alias /opt/xiu/web/img/;
    add_header Cache-Control "public, max-age=2592000, immutable";
}

# 脚本、样式：地址里带 ?v=数字，改完代码 +1 就会重新下载，所以可以让浏览器缓存（少请求、进游戏更快）
location /xiuxian/js/ {
    access_log off;   # 不记访问日志，省磁盘
    alias /opt/xiu/web/js/;
    add_header Cache-Control "public, max-age=604800";
    gzip on; gzip_types application/javascript text/javascript; gzip_min_length 1024;
}
location /xiuxian/css/ {
    access_log off;   # 不记访问日志，省磁盘
    alias /opt/xiu/web/css/;
    add_header Cache-Control "public, max-age=604800";
    gzip on; gzip_types text/css; gzip_min_length 1024;
}

# 网页（静态文件，直接读取仓库目录）
location /xiuxian/ {
    access_log off;   # 不记访问日志，省磁盘
    alias /opt/xiu/web/;
    index index.html;
    add_header Cache-Control "no-cache";
}

# 存档接口 → Python 服务
location /xiuxian/api/ {
    access_log off;   # 不记访问日志，省磁盘
    proxy_pass http://127.0.0.1:18300/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 4m;
    gzip on; gzip_proxied any; gzip_types application/json; gzip_min_length 1024;   # 读存档压缩传输
}
