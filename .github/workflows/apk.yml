# 打包安卓安装包：改了 server-url.txt、android/ 或图片 web/img 会自动打包；也可在 Actions 页面点 Run workflow 手动打包
# 打好的 apk 在仓库 Releases 的「安卓安装包」里下载
name: 打包APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["server-url.txt", "android/**", "web/img/**", ".github/workflows/apk.yml"]
permissions:
  contents: write
concurrency: { group: apk, cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: 服务器地址
        run: |
          URL=$(grep -v '^\s*#' server-url.txt | sed 's/^\s*//;s/\s*$//' | grep -m1 .)
          echo "服务器地址: $URL"
          if [ -z "$URL" ] || echo "$URL" | grep -q "服务器IP"; then echo "::error::请先在 server-url.txt 填写服务器地址"; exit 1; fi
          mkdir -p android/app/src/main/assets
          echo "$URL" > android/app/src/main/assets/server.txt
      - name: 图片放进安装包（附带版本号，和服务器不一致时自动从服务器下载新图）
        run: |
          A=android/app/src/main/assets
          cp -r web/img $A/img
          git -c core.quotepath=false rev-parse HEAD:web/img | cut -c1-8 > $A/img_ver.txt
          git -c core.quotepath=false ls-files -s web/img | awk -F'\t' '{split($1,a," "); print substr($2,9)" "substr(a[2],1,8)}' >> $A/img_ver.txt
          head -3 $A/img_ver.txt; wc -l $A/img_ver.txt
      - name: 签名文件（第一次自动生成并保存到仓库，以后都用同一个，新包才能覆盖安装）
        run: |
          git pull --ff-only origin "${GITHUB_REF_NAME}" || true
          if [ ! -f android/xiu.keystore ]; then
            keytool -genkeypair -v -keystore android/xiu.keystore -alias xiu -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass xiu123456 -keypass xiu123456 -dname "CN=xiu, O=xiu, C=CN"
            git config user.name "github-actions"; git config user.email "actions@github.com"
            git add android/xiu.keystore; git commit -m "APK 签名文件 [skip ci]"; git push
          fi
      - name: 打包
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: 发布到 Releases
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk xiu.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk xiu.apk --title "安卓安装包" --notes "第 ${{ github.run_number }} 次打包"
      - uses: actions/upload-artifact@v4
        with: { name: xiu-apk, path: xiu.apk }
