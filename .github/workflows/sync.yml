name: Sync Code from A

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout B repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download A repository content
        env:
          SOURCE_REPO: https://github.com/原作者用户名/A仓库名.git
        run: |
          git clone --depth 1 "$SOURCE_REPO" /tmp/source

          rsync -av --delete \
            --exclude='.git' \
            /tmp/source/ ./

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "代码没有变化，无需提交"
            exit 0
          fi

          git commit -m "Sync code from upstream"
          git push origin HEAD
          
